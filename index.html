<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="/juzu/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Juzu" />
    <meta name="theme-color" content="#0d110f" />
    <link rel="icon" type="image/svg+xml" href="/juzu/favicon.svg" />
    <title>Juzu — The Search for Paititi</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d110f;
        color: #f2ede4;
        font-family: Georgia, serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }
      canvas#gl, #surface {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100lvh;
      }
      #surface {
        z-index: 10;
      }
      #juzu-touch-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 35;
      }
      @keyframes juzuChakanaGlow {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(220, 185, 130, 0.45)); transform: scale(1.0); }
        50% { filter: drop-shadow(0 0 24px rgba(255, 215, 120, 0.85)); transform: scale(1.04); }
      }
    </style>
  </head>
  <body>
    <!-- Pre-bootstrap Archaeological Expedition Loading Screen -->
    <div id="juzu-loading-screen" style="position:fixed;inset:0;background:#0d110f;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Georgia,serif;color:#f2ede4;transition:opacity 0.75s ease;user-select:none;">
      <div style="width:78px;height:78px;margin-bottom:22px;animation:juzuChakanaGlow 3s ease-in-out infinite;">
        <svg viewBox="0 0 100 100" width="78" height="78" fill="none">
          <path d="M35 5 H65 V20 H80 V35 H95 V65 H80 V80 H65 V95 H35 V80 H20 V65 H5 V35 H20 V20 H35 Z" fill="rgba(38, 30, 20, 0.9)" stroke="#e6c896" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="50" cy="50" r="14" fill="#0d110f" stroke="#d4b888" stroke-width="2.5"/>
          <circle cx="50" cy="50" r="5" fill="#ffd700"/>
        </svg>
      </div>
      <div style="font-size:11px;letter-spacing:0.36em;color:#c9a468;text-transform:uppercase;margin-bottom:8px;">Archaeological Expedition · Andes</div>
      <h1 style="font-size:38px;letter-spacing:0.22em;margin:0 0 6px 0;font-weight:400;color:#fdfaf2;text-shadow:0 2px 14px rgba(0,0,0,0.85);">J U Z U</h1>
      <div style="font-size:13px;letter-spacing:0.12em;color:#a89f8d;font-style:italic;margin-bottom:28px;">The Search for Paititi</div>
      <div style="width:240px;height:5px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;position:relative;margin-bottom:12px;border:1px solid rgba(212,184,136,0.25);">
        <div id="juzu-loading-bar" style="width:25%;height:100%;background:linear-gradient(90deg, #caa05b, #ffd988);transition:width 0.2s ease;"></div>
      </div>
      <div id="juzu-loading-status" style="font-size:11px;letter-spacing:0.08em;color:#9b9487;margin-bottom:16px;">Loading Andean Terrain · 25%</div>
      <button id="juzu-btn-reload-latest" onclick="window.__juzuForceUpdateAndReload(event)" style="background:rgba(24,32,26,0.85);border:1px solid rgba(212,184,136,0.5);color:#e6c896;padding:8px 18px;border-radius:20px;font-size:11px;letter-spacing:0.08em;font-family:Georgia,serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,0.6);pointer-events:auto;transition:transform 0.15s ease, background 0.15s ease;">
        <span style="font-size:13px;">🔄</span><span>Load Latest Version (Clear Cache)</span>
      </button>
    </div>

    <canvas id="gl"></canvas>
    <div id="surface"></div>
    <div id="juzu-touch-layer"></div>

    <script>
      window.__juzuDismissLoading = function() {
        var el = document.getElementById('juzu-loading-screen');
        if (el) {
          el.style.pointerEvents = 'none';
          el.style.opacity = '0';
          setTimeout(function() { el.style.display = 'none'; }, 400);
        }
      };

      window.__juzuForceUpdateAndReload = function(e) {
        if (e) {
          e.stopPropagation();
          e.preventDefault();
        }
        var btn = document.getElementById('juzu-btn-reload-latest');
        if (btn) {
          btn.disabled = true;
          btn.innerHTML = '<span style="font-size:13px;">⏳</span><span>Purging cache & fetching latest...</span>';
          btn.style.opacity = '0.75';
        }
        var status = document.getElementById('juzu-loading-status');
        if (status) status.textContent = 'Purging cache & fetching latest build...';

        var swPromise = ('serviceWorker' in navigator)
          ? navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(r) { return r.unregister(); }));
            }).catch(function() {})
          : Promise.resolve();

        var cachePromise = ('caches' in window)
          ? caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            }).catch(function() {})
          : Promise.resolve();

        Promise.all([swPromise, cachePromise]).then(function() {
          var cleanUrl = window.location.origin + window.location.pathname;
          window.location.replace(cleanUrl + '?v=' + Date.now());
        }).catch(function() {
          var cleanUrl = window.location.origin + window.location.pathname;
          window.location.replace(cleanUrl + '?v=' + Date.now());
        });
      };

      // Tap-to-dismiss safety: tapping screen after 2.5s or when ready dismisses immediately
      var startTime = Date.now();
      var loadingEl = document.getElementById('juzu-loading-screen');
      if (loadingEl) {
        loadingEl.addEventListener('click', function(e) {
          if (e && e.target && e.target.closest('#juzu-btn-reload-latest')) return;
          if (window.__juzuSceneReady || window.__juzuReady || (Date.now() - startTime > 2500)) {
            window.__juzuDismissLoading();
          }
        });
      }

      // Smooth active progress bar animation
      var bar = document.getElementById('juzu-loading-bar');
      var status = document.getElementById('juzu-loading-status');
      var progress = 25;
      var dismissed = false;

      var progressTimer = setInterval(function() {
        if (dismissed) return;
        if (window.__juzuSceneReady) {
          dismissed = true;
          clearInterval(progressTimer);
          if (bar) bar.style.width = '100%';
          if (status) status.textContent = 'Expedition Ready';
          setTimeout(function() {
            window.__juzuDismissLoading();
          }, 150);
          return;
        }

        // Active animated progression
        if (progress < 92) {
          progress += Math.random() * 9 + 4;
          if (progress > 92) progress = 92;
          if (bar) bar.style.width = Math.round(progress) + '%';
          if (status) {
            if (progress < 45) status.textContent = 'Loading Andean Terrain · ' + Math.round(progress) + '%';
            else if (progress < 75) status.textContent = 'Calibrating Atmosphere & Lighting · ' + Math.round(progress) + '%';
            else status.textContent = 'Assembling Expedition Gear · ' + Math.round(progress) + '%';
          }
        }

        // Safety fallback: if engine is booted for > 4.5s, dismiss loading screen
        if (Date.now() - startTime > 4500 && window.__juzuReady) {
          dismissed = true;
          clearInterval(progressTimer);
          if (bar) bar.style.width = '100%';
          if (status) status.textContent = 'Expedition Ready';
          setTimeout(function() {
            window.__juzuDismissLoading();
          }, 100);
        }
      }, 90);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
