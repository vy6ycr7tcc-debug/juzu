<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="/juzu/manifest.webmanifest" />
    <!-- P-MOBILE F11: Add-to-Home-Screen launches standalone full-bleed
         (no Safari chrome) instead of a regular browser tab. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Juzu" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/juzu/favicon.svg" />
    <meta name="description" content="Realistic third-person open-world action-adventure game set in the Inca Andes. Built on three.js with WebGPU & WebGL2 fallback." />
    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="Juzu — The Search for Paititi" />
    <meta property="og:description" content="Realistic third-person open-world action-adventure game set in the Inca Andes. WebGPU primary + WebGL2 fallback." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vy6ycr7tcc-debug.github.io/juzu/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Juzu — The Search for Paititi" />
    <meta name="twitter:description" content="Realistic third-person action-adventure in the Inca Andes. Three.js WebGPU + WebGL2." />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Juzu — The Search for Paititi</title>
    <style>
      body, #app canvas {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        /* P-MOBILE: no gray flash on tap, no long-press callout on iOS. */
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* Safe area insets for UI if any */
      #ui-root {
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      #ui-root button {
        touch-action: manipulation;
      }

      /* Pillar C: Accessibility & High-Contrast Mode Styles */
      body.high-contrast-mode [data-hud-element] {
        background: rgba(0, 0, 0, 0.95) !important;
        color: #ffffff !important;
        border-color: #ffd700 !important;
        font-weight: 700 !important;
        text-shadow: 0 2px 4px #000000 !important;
        box-shadow: 0 0 12px rgba(255, 215, 0, 0.6) !important;
      }
      body.high-contrast-mode #juzu-pause-menu,
      body.high-contrast-mode #juzu-settings-menu,
      body.high-contrast-mode #juzu-victory-screen {
        filter: contrast(1.22);
      }

      @keyframes juzuChakanaGlow {
        0%, 100% {
          filter: drop-shadow(0 0 10px rgba(220, 185, 130, 0.45));
          transform: scale(1.0);
        }
        50% {
          filter: drop-shadow(0 0 24px rgba(255, 215, 120, 0.85));
          transform: scale(1.04);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Pre-bootstrap Archaeological Expedition Loading Screen -->
      <div id="juzu-loading-screen" style="position:fixed;inset:0;background:#0d110f;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Georgia,serif;color:#f2ede4;transition:opacity 0.75s ease;user-select:none;">
        <div style="width:78px;height:78px;margin-bottom:22px;animation:juzuChakanaGlow 3s ease-in-out infinite;">
          <svg viewBox="0 0 100 100" width="78" height="78" fill="none">
            <path d="M35 5 H65 V20 H80 V35 H95 V65 H80 V80 H65 V95 H35 V80 H20 V65 H5 V35 H20 V20 H35 Z" fill="rgba(38, 30, 20, 0.9)" stroke="#e6c896" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="50" cy="50" r="14" fill="#0d110f" stroke="#d4b888" stroke-width="2.5"/>
            <circle cx="50" cy="50" r="5" fill="#ffd700"/>
          </svg>
        </div>
        <div style="font-size:11px;letter-spacing:0.36em;color:#c9a468;text-transform:uppercase;margin-bottom:8px;">Archaeological Expedition · Andes</div>
        <h1 style="font-size:38px;letter-spacing:0.22em;margin:0 0 6px 0;font-weight:400;color:#fdfaf2;text-shadow:0 2px 14px rgba(0,0,0,0.85);">J U Z U</h1>
        <div style="font-size:13px;letter-spacing:0.12em;color:#a89f8d;font-style:italic;margin-bottom:28px;">The Search for Paititi</div>
        <!-- Progress Bar -->
        <div style="width:240px;height:5px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;position:relative;margin-bottom:12px;border:1px solid rgba(212,184,136,0.25);">
          <div id="juzu-loading-bar" style="width:15%;height:100%;background:linear-gradient(90deg, #caa05b, #ffd988);transition:width 0.2s ease;"></div>
        </div>
        <div id="juzu-loading-status" style="font-size:11px;letter-spacing:0.08em;color:#9b9487;">Loading Andean Terrain · 15%</div>
        <!-- Load Latest Version & Clear Cache Button -->
        <button id="juzu-btn-reload-latest" onclick="window.__forceReloadLatest()" style="margin-top:22px;padding:8px 16px;background:rgba(212,184,136,0.12);border:1px solid rgba(212,184,136,0.45);border-radius:4px;color:#f2ede4;font-family:Georgia,serif;font-size:12px;letter-spacing:0.06em;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all 0.2s ease;">
          <span style="font-size:13px;">🔄</span>
          <span>Load Latest Version (Clear Cache)</span>
        </button>
      </div>
    </div>

    <script>
      window.__forceReloadLatest = async function() {
        var btn = document.getElementById('juzu-btn-reload-latest');
        if (btn) btn.innerHTML = '<span>⏳</span><span>Clearing cache & reloading...</span>';
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            for (var i = 0; i < regs.length; i++) {
              await regs[i].unregister();
            }
          }
          if ('caches' in window) {
            var keys = await caches.keys();
            for (var j = 0; j < keys.length; j++) {
              await caches.delete(keys[j]);
            }
          }
          localStorage.clear();
          sessionStorage.clear();
        } catch (err) {
          console.warn('Cache clearing error:', err);
        }
        var u = new URL(window.location.href);
        u.searchParams.set('v', String(Date.now()));
        window.location.href = u.toString();
      };

      window.__setLoadingProgress = function(pct, text) {
        var bar = document.getElementById('juzu-loading-bar');
        var txt = document.getElementById('juzu-loading-status');
        if (bar) bar.style.width = Math.min(100, Math.max(0, pct)) + '%';
        if (txt && text) txt.textContent = text + ' · ' + Math.round(pct) + '%';
      };
      window.__hideLoadingScreen = function() {
        var el = document.getElementById('juzu-loading-screen');
        if (el) {
          el.style.opacity = '0';
          el.style.pointerEvents = 'none';
          setTimeout(function() { if (el) el.style.display = 'none'; }, 750);
        }
      };
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
